name: Publish to NPM

on:
 push:
   branches:
     - master
 workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      # Ensure npm 11.5.1 or later is installed
      - name: Update npm
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm ci
      - name: Build package
        run: npm run build
      - name: Prepare publish artifacts
        run: |
          rm -rf .publish
          mkdir -p .publish
          find bin -type f -name '*.js' -exec cp --parents {} .publish \;
          cp package.json README.md LICENSE .publish/
          node -e "const fs=require('node:fs');const pkgPath='.publish/package.json';const pkg=JSON.parse(fs.readFileSync(pkgPath,'utf8'));delete pkg.devDependencies;delete pkg.scripts;pkg.files=['bin/**/*.js'];fs.writeFileSync(pkgPath,JSON.stringify(pkg,null,2)+'\n');"
      - run: npm publish ./.publish --provenance --access public
